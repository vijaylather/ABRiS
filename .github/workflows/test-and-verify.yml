name: Test and verify

on:
  push:
    branches: [ master, spark-4.0 ]
  pull_request:
    branches: [ master, spark-4.0 ]

jobs:
  build:
    runs-on: ubuntu-latest

    name: Spark 4.0, Scala 2.13

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run tests
        run: mvn clean verify -Pspark-4.0,scala-2.13
